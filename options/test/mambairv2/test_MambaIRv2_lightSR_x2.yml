# general settings
name: test_MambaIRv2_lightSR_x2
model_type: MambaIRv2LightModel
scale: 2
num_gpu: 1
manual_seed: 10

datasets:
  test_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/SR/Set5/HR
    dataroot_lq: datasets/SR/Set5/LR_bicubic/X2
    io_backend:
      type: disk
    phase: test
    scale: 2

network_g:
  type: MambaIRv2Light
  upscale: 2
  in_chans: 3
  img_size: 64
  img_range: 1.
  embed_dim: 48
  d_state: 8
  depths: [ 5, 5, 5, 5 ]
  num_heads: [ 4, 4, 4, 4 ]
  window_size: 16
  inner_rank: 32
  num_tokens: 64
  convffn_kernel_size: 5
  mlp_ratio: 1.0
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'
# path
path:
  pretrain_network_g: experiments/pretrained_models/mambairv2_lightSR_x2.pth
  strict_load_g: true

# validation settings
val:
  save_img: false
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
